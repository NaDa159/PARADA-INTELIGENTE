<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parada Inteligente | Erechim</title>

    <!-- Fonte Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Estilo Principal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container-principal">

        <!-- CABEÇALHO SUPERIOR -->
        <header class="cabecalho">
            <div class="identidade">
                <div class="identidade-texto">
                    <h1>Parada Inteligente • Erechim</h1>
                    <p>Projeto Integrador • Engenharia Elétrica</p>
                </div>
            </div>

            <div class="informacoes-topo">
                <!-- RELÓGIO -->
                <section class="informacao-relogio" aria-label="Data e horário local">
                    <span id="data-atual">Carregando data...</span>
                    <strong id="hora-atual">--:--:--</strong>
                </section>

                <div class="divisor-topo"></div>

                <!-- CLIMA INTEGRADO -->
                <section class="informacao-clima" aria-label="Clima atual">
                    <span id="icone-clima" aria-hidden="true">☁️</span>
                    <div class="clima-conteudo">
                        <div class="linha-clima">
                            <strong id="temperatura-atual">--°C</strong>
                        </div>
                        <div class="temperaturas-extremas">
                            <span>Máx. <strong id="temperatura-maxima">--°C</strong></span>
                            <span>Mín. <strong id="temperatura-minima">--°C</strong></span>
                        </div>
                    </div>
                </section>
            </div>
        </header>

        <!-- ÁREA CENTRAL (MAPA E BOTÕES) -->
        <main class="conteudo-principal">
            <div class="area-mapa" id="container-area-mapa">

                <!-- MAPA LEAFLET -->
                <div id="mapa-erechim" aria-label="Mapa interativo de Erechim"></div>

                <!-- BOTÕES LATERAIS ESQUERDA -->
                <aside class="botoes-laterais esquerda" aria-label="Navegação Principal">
                    <button class="botao-lateral botao-principal" onclick="mostrarIA()">Assistente IA</button>
                    <button class="botao-lateral" onclick="mostrarChegadas()">Próximas Chegadas</button>
                    <button class="botao-lateral" onclick="mostrarRotas()">Linhas e Itinerários</button>
                    <button class="botao-lateral" onclick="mostrarHorarios()">Quadro de Horários</button>
                </aside>

                <!-- BOTÕES LATERAIS DIREITA -->
                <aside class="botoes-laterais direita" aria-label="Navegação Secundária">
                    <button class="botao-lateral" onclick="mostrarPlanejador()">Planejador de Viagens</button>
                    <button class="botao-lateral" onclick="mostrarAcessibilidade()">Acessibilidade</button>
                    <button class="botao-lateral" onclick="mostrarMonitoramento()">Info da Parada</button>
                    <button class="botao-lateral botao-ajuda" onclick="mostrarAjuda()">Ajuda / SOS</button>
                </aside>

                <!-- PAINEL DESDOBRÁVEL DE INTERAÇÃO -->
                <section id="painel-funcionalidade" class="painel-funcionalidade" aria-hidden="true">
                    <div class="painel-cabecalho">
                        <div>
                            <span class="painel-categoria" id="painel-categoria-sub">PARADA INTELIGENTE • ERECHIM</span>
                            <h2 id="painel-titulo">Painel</h2>
                        </div>
                        <button class="fechar-painel" onclick="fecharPainel()" aria-label="Fechar painel">×</button>
                    </div>
                    <div id="painel-conteudo" class="painel-conteudo"></div>
                </section>

                <!-- NOTIFICAÇÃO TOAST -->
                <div id="aviso-sistema" class="aviso-sistema" role="status" aria-live="polite"></div>

            </div>
        </main>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Script Principal Unificado -->
    <script src="script.js"></script>
</body>
</html>
